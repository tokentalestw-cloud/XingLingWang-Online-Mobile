services:
  - type: web
    name: xinglingwang-online
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*' --timeout-keep-alive 65
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
